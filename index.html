<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Alfa</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section id="auth" class="screen auth">
    <div class="brand">
      <div class="logo">α</div>
      <h1>Alfa</h1>
      <p>Paper desk · Solana memecoins</p>
    </div>
    <form id="form" class="card">
      <label>Usuario<input name="user" value="trader" autocomplete="username"></label>
      <label>Password<input name="pass" type="password" value="desk2026" autocomplete="current-password"></label>
    </form>
    <button class="cta" id="go" type="button">Entrar</button>
    <button class="link" id="reg" type="button">Crear cuenta</button>
    <div class="err" id="err"></div>
  </section>
  <section id="app" class="screen app hidden">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="liveDot">PAPER</div>
        <strong>Alfa</strong>
      </div>
      <button type="button" id="refresh" class="iconbtn" aria-label="Actualizar">↻</button>
    </header>
    <main class="scroll" id="scroll">
      <div class="hero">
        <span class="k">Patrimonio</span>
        <div class="eq" id="equity">—</div>
        <div class="pills">
          <span id="statusPill">Apagado</span>
          <span id="flowPill">0 compras · 0 ventas</span>
        </div>
        <label class="power">
          <div>
            <b id="powerLabel">Alfa</b>
            <small id="powerHint">Compra y vende memecoins en bucle</small>
          </div>
          <span class="sw"><input type="checkbox" id="power"><i></i></span>
        </label>
      </div>
      <section class="pane on" data-pane="market">
        <div class="hrow">
          <h2>Memecoins Solana</h2>
          <button type="button" id="refresh2" class="mini">Actualizar</button>
        </div>
        <div class="list" id="auditList"></div>
        <p class="foot" id="auditMeta">Pulsa actualizar.</p>
      </section>
      <section class="pane" data-pane="book">
        <div class="stats">
          <div><span>Caja</span><b id="cash">—</b></div>
          <div><span>Abiertas</span><b id="npos">0</b></div>
          <div><span>Ciclos</span><b id="runs">0</b></div>
        </div>
        <h2>Posiciones</h2>
        <div class="list" id="pos"></div>
        <div class="card pad">
          <div class="row">
            <span>Capital paper</span>
            <div class="money"><b>$</b><input id="cap" type="number" min="100" step="50" inputmode="decimal"></div>
          </div>
          <div class="row muted"><span>Ticket</span><span id="ticket">—</span></div>
        </div>
      </section>
      <section class="pane" data-pane="log">
        <h2>Flujo compra / venta</h2>
        <div class="list" id="log"></div>
      </section>
    </main>
    <nav class="tabbar">
      <button class="on" data-pane="market" type="button">Mercado</button>
      <button data-pane="book" type="button">Libro</button>
      <button data-pane="log" type="button">Actividad</button>
      <button id="out" type="button">Salir</button>
    </nav>
  </section>
  <script src="app.js"></script>
</body>
</html>
