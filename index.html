<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Alfa</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section id="auth" class="screen auth">
    <div class="brand"><div class="logo">α</div><h1>Alfa</h1><p>Paper · todos los mercados cripto</p></div>
    <form id="form" class="card">
      <label>Usuario<input name="user" value="trader" autocomplete="username"></label>
      <label>Password<input name="pass" type="password" value="desk2026" autocomplete="current-password"></label>
    </form>
    <button class="cta" id="go" type="button">Entrar</button>
    <button class="link" id="reg" type="button">Crear cuenta</button>
    <div class="err" id="err"></div>
  </section>
  <section id="app" class="screen app hidden">
    <header class="topbar"><div><div class="eyebrow" id="liveDot">PAPER</div><strong>Alfa</strong></div>
      <button type="button" id="refresh" class="iconbtn">↻</button></header>
    <main class="scroll">
      <div class="hero"><span class="k">Patrimonio</span><div class="eq" id="equity">—</div>
        <div class="pills"><span id="statusPill">Apagado</span><span id="flowPill">10 compra / 10 venta · min</span></div>
        <label class="power"><div><b id="powerLabel">Alfa</b><small id="powerHint">10 compras y 10 ventas por minuto</small></div>
          <span class="sw"><input type="checkbox" id="power"><i></i></span></label></div>
      <div class="liveboard">
        <div class="livehead"><span class="pulse" id="pulse"></span><span id="liveClock">—</span></div>
        <div class="livestats">
          <div class="ls buy"><span>Compras</span><b id="statBuys">0</b><small id="lastBuy">—</small></div>
          <div class="ls sell"><span>Ventas</span><b id="statSells">0</b><small id="lastSell">—</small></div>
        </div>
        <div class="barwrap"><div class="bar buybar" id="buyBar"></div><div class="bar sellbar" id="sellBar"></div></div>
        <div class="livetick" id="liveTick">Sin operaciones</div>
      </div>
      <div class="charts">
        <div class="chartbox"><div class="ctitle">Patrimonio</div><canvas id="eqChart" width="360" height="140"></canvas></div>
        <div class="chartbox"><div class="ctitle">Compras vs ventas</div><canvas id="flowChart" width="360" height="140"></canvas></div>
      </div>
      <section class="pane on" data-pane="market">
        <div class="hrow"><h2>Mercados cripto</h2><button type="button" id="refresh2" class="mini">Actualizar</button></div>
        <div class="list" id="auditList"></div><p class="foot" id="auditMeta">BTC, ETH, SOL y más.</p>
      </section>
      <section class="pane" data-pane="book">
        <div class="stats"><div><span>Caja</span><b id="cash">—</b></div><div><span>Abiertas</span><b id="npos">0</b></div><div><span>Ciclos</span><b id="runs">0</b></div></div>
        <h2>Posiciones</h2><div class="list" id="pos"></div>
        <div class="card pad"><div class="row"><span>Capital paper</span><div class="money"><b>$</b><input id="cap" type="number" min="100" step="50" inputmode="decimal"></div></div>
          <div class="row muted"><span>Ticket</span><span id="ticket">—</span></div></div>
      </section>
      <section class="pane" data-pane="log"><h2>Flujo</h2><div class="list" id="log"></div></section>
    </main>
    <nav class="tabbar">
      <button class="on" data-pane="market" type="button">Mercado</button>
      <button data-pane="book" type="button">Libro</button>
      <button data-pane="log" type="button">Actividad</button>
      <button id="out" type="button">Salir</button>
    </nav>
  </section>
  <script src="app.js"></script>
</body></html>
