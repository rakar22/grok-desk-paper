<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#02010a"/><title>Alfa</title><link rel="stylesheet" href="styles.css"/></head>
<body><div class="fx"></div>
<section id="auth" class="screen auth"><div class="brand"><div class="logo">α</div><h1>ALFA</h1><p>PAPER NODE · MULTI MARKET</p></div>
<form id="form" class="card"><label>Usuario<input name="user" value="trader"></label><label>Password<input name="pass" type="password" value="desk2026"></label></form>
<button class="cta" id="go" type="button">INICIAR SESIÓN</button><button class="link" id="reg" type="button">Crear cuenta</button><div class="err" id="err"></div></section>
<section id="app" class="screen app hidden">
<header class="topbar"><div><div class="eyebrow" id="liveDot">STANDBY</div><strong>ALFA NODE</strong></div><button type="button" id="refresh" class="iconbtn">↻</button></header>
<main class="scroll">
<div class="hero"><span class="k">EQUITY</span><div class="eq" id="equity">—</div>
<div class="pills"><span id="statusPill">OFFLINE</span><span id="flowPill">10 BUY / 10 SELL · MIN</span></div>
<button type="button" id="powerBtn" class="core off"><span class="core-ring"></span><span class="core-label" id="powerLabel">OFF</span></button>
<p class="hintline" id="powerHint">Pulsa el núcleo para encender</p></div>
<div class="liveboard"><div class="livehead"><span class="pulse" id="pulse"></span><span id="liveClock">—</span></div>
<div class="livestats"><div class="ls buy"><span>BUY</span><b id="statBuys">0</b><small id="lastBuy">—</small></div>
<div class="ls sell"><span>SELL</span><b id="statSells">0</b><small id="lastSell">—</small></div></div>
<div class="barwrap"><div class="bar buybar" id="buyBar"></div><div class="bar sellbar" id="sellBar"></div></div>
<div class="livetick" id="liveTick">Sin operaciones</div></div>
<div class="charts"><div class="chartbox"><div class="ctitle">Equity</div><canvas id="eqChart" width="360" height="140"></canvas></div>
<div class="chartbox"><div class="ctitle">Buy / Sell</div><canvas id="flowChart" width="360" height="140"></canvas></div></div>
<section class="pane on" data-pane="market"><div class="hrow"><h2>Universe</h2><button type="button" id="refresh2" class="mini">Scan</button></div><div class="list" id="auditList"></div><p class="foot" id="auditMeta"></p></section>
<section class="pane" data-pane="book"><div class="stats"><div><span>Cash</span><b id="cash">—</b></div><div><span>Open</span><b id="npos">0</b></div><div><span>Ticks</span><b id="runs">0</b></div></div>
<h2>Positions</h2><div class="list" id="pos"></div>
<div class="card pad"><div class="row"><span>Capital</span><div class="money"><b>$</b><input id="cap" type="number" min="100" step="50"></div></div><div class="row muted"><span>Ticket</span><span id="ticket">—</span></div></div></section>
<section class="pane" data-pane="log"><h2>Tape</h2><div class="list" id="log"></div></section>
</main>
<nav class="tabbar"><button class="on" data-pane="market" type="button">Scan</button><button data-pane="book" type="button">Book</button><button data-pane="log" type="button">Tape</button><button id="out" type="button">Exit</button></nav>
</section><script src="app.js"></script></body></html>
