<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Alfa TON</title><link rel="stylesheet" href="styles.css"/><link rel="stylesheet" href="extra.css"/><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body>
<section id="gate" class="screen">
<div class="hero"><span class="k">Alfa</span><h2>Sesion</h2>
<input id="emailIn" type="email" placeholder="tu correo" style="width:100%;padding:12px;border-radius:12px;border:0;margin:12px 0">
<button type="button" class="cta" id="emailGo">Entrar</button>
<p class="hintline">Se guarda en este movil. No es un servidor.</p></div>
</section>
<section id="app" class="screen app hidden">
<nav class="tabbar topnav">
<button class="on" data-pane="market" type="button">Mercado</button>
<button data-pane="sig" type="button">Señales</button>
<button data-pane="agent" type="button">Agente</button>
<button data-pane="chat" type="button">Chat</button>
</nav>
<main class="scroll">
<section class="pane on" data-pane="market">
<div class="hero"><div class="eyebrow" id="liveDot">STANDBY</div><span class="k" id="who">Alfa</span><div class="eq" id="equity">-</div>
<label class="capbox"><span>Capital</span><div class="money big"><b>€</b><input id="capHome" type="number" min="0.5" step="0.5"></div></label>
<div class="startrow"><button type="button" id="powerBtn" class="core off"><span id="powerLabel">START</span></button>
<button type="button" id="refresh" class="ghost">Actualizar</button>
<button type="button" id="ticketUp" class="ghost">Actualizar ticket</button></div>
</div>
<div class="liveboard"><div class="livestats"><div class="ls buy"><span>Compras</span><b id="statBuys">0</b></div><div class="ls sell"><span>Ventas</span><b id="statSells">0</b></div></div>
<p class="hintline" id="ticketLine">Ticket -</p></div>
</section>
<section class="pane" data-pane="sig">
<h2>Base de señales</h2>
<button type="button" id="newSig" class="cta">Nueva señal</button>
<div class="card pad" id="sigNow"></div>
<div class="list" id="sigList"></div>
</section>
<section class="pane" data-pane="agent">
<h2>Agente maestro</h2>
<input id="agentGram" type="number" min="0.1" step="0.05" value="1.12">
<input id="agentRisk" type="number" min="2" max="20" value="15">
<button type="button" class="cta" id="agentRun">Calcular bankroll</button>
<button type="button" class="ghost" id="ticketUp2">Actualizar ticket</button>
<div class="card pad" id="agentOut"></div>
</section>
<section class="pane" data-pane="chat">
<h2>Chat agente</h2>
<p class="hintline">Local. Las fotos se guardan aqui; no las analiza un modelo remoto.</p>
<div id="chatLog" class="list"></div>
<input id="chatFile" type="file" accept="image/*">
<input id="chatIn" placeholder="Pregunta al maestro" style="width:100%;padding:12px;border-radius:12px;border:0;margin:8px 0">
<button type="button" class="cta" id="chatSend">Enviar</button>
</section>
</main></section>
<script src="open.js"></script><script src="swap.js"></script><script src="engine.js"></script><script src="agent.js"></script>
</body></html>
