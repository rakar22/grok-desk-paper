<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Alfa Kraken</title>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="extra.css"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<section id="app" class="screen app">
<nav class="tabbar topnav">
<button class="on" data-pane="market" type="button">Mercado</button>
<button data-pane="book" type="button">Libro</button>
<button data-pane="live" type="button">Kraken</button>
</nav>
<main class="scroll">
<section class="pane on" data-pane="market">
<div class="hero">
<div class="eyebrow" id="modeDot">DEMO</div>
<span class="k">Alfa · Kraken</span>
<div class="eq" id="equity">-</div>
<div class="presets">
<button type="button" class="chip on" id="modeDemo">Demo</button>
<button type="button" class="chip" id="modeReal">Dinero real</button>
</div>
<label class="capbox"><span>Capital demo (min 2€)</span>
<div class="money big"><b>€</b><input id="capHome" type="number" min="2" step="0.5" value="2"></div></label>
<div class="presets">
<button type="button" class="chip" data-cap="2">2</button>
<button type="button" class="chip" data-cap="10">10</button>
<button type="button" class="chip" data-cap="50">50</button>
<button type="button" class="chip" data-cap="100">100</button>
</div>
<div class="startrow">
<button type="button" id="powerBtn" class="core off"><span id="powerLabel">START</span></button>
<button type="button" id="refresh" class="ghost">Actualizar</button>
</div>
<p class="hintline" id="hint">Demo: 5–20 ops / 5s. Real bloqueado.</p>
</div>
<div class="liveboard">
<div class="livestats">
<div class="ls buy"><span>Compras</span><b id="statBuys">0</b><small id="lastBuy">-</small></div>
<div class="ls sell"><span>Ventas</span><b id="statSells">0</b><small id="lastSell">-</small></div>
</div>
<div class="livetick" id="liveTick">Apagado</div>
</div>
<div class="list" id="tickList"></div>
</section>
<section class="pane" data-pane="book">
<div class="stats">
<div><span>Caja</span><b id="cash">-</b></div>
<div><span>Abiertas</span><b id="npos">0</b></div>
<div><span>Ciclos</span><b id="runs">0</b></div>
</div>
<div class="list" id="pos"></div>
<div class="list" id="log"></div>
</section>
<section class="pane" data-pane="live">
<h2>Kraken</h2>
<p class="hintline" id="krakenStatus">Demo ticker público. Real = LIVE LOCK.</p>
<div class="card pad">
<p>No pegues API Secret aquí.</p>
<a class="cta" href="https://pro.kraken.com/app/settings/api" target="_blank" rel="noopener">Crear API key (Pro)</a>
</div>
<pre id="liveLock" class="hintline" style="white-space:pre-wrap"></pre>
</section>
</main>
</section>
<script src="kraken.js"></script>
<script src="engine.js"></script>
</body>
</html>
